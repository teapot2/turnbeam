name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly scan: a newly published Go or dependency vulnerability fails the
  # vulnerability job, which is the signal to bump go.mod's toolchain line.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: Go (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make build

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make vulncheck
